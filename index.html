<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d27">
<title>RA Rohan Raj Chat</title>
<style>
:root{color-scheme:dark;--bg:#080d27;--panel:#111a3a;--blue:#087cff;--line:#52628e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{padding:18px 16px;background:#111b42;text-align:center;border-bottom:1px solid #263b78}
.logo{width:84px;height:84px;object-fit:contain;border-radius:18px;margin:auto;display:block}
h1{margin:8px 0 4px;font-size:22px}
small,.muted{color:#aebde9}
main{max-width:520px;margin:auto;padding:16px}
.card{background:var(--panel);padding:18px;border-radius:18px;margin:16px 0}
input{width:100%;padding:13px;margin:7px 0;background:var(--bg);color:white;border:1px solid var(--line);border-radius:10px;font-size:16px}
button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;background:var(--blue);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55}
.google{background:white;color:#222}
.secondary{background:#27365e}
#chatArea{display:none}
#messages{height:300px;overflow:auto;background:var(--bg);padding:12px;border-radius:12px}
.msg{background:#193e83;padding:10px;margin:8px 0;border-radius:12px;overflow-wrap:anywhere}
.msg.mine{background:#174c50}
#status,#friendStatus{overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.row button{width:auto;min-width:90px}
@media(max-width:420px){main{padding:10px}.card{padding:14px}}
</style>
</head>
<body>
<header>
